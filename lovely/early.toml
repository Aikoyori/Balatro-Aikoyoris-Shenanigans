[manifest]
version = "1.2"
dump_lua = true
priority = -500000

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = """Game = Object:extend()"""
position = "after"
payload = """
AKYRS_CROSSMOD = {}
AKYRS_CROSSMOD.suit_to_atlas_map = {}
AKYRS_CROSSMOD.rank_to_atlas_map = {}
function akyrs_unpack_unordered_recursive(tbl, key)
    local new_key, value = next(tbl, key)
    if new_key == nil then return end

    return value, akyrs_unpack_unordered_recursive(tbl, new_key)
end

function akyrs_unpack_unordered(tbl)
    local key, value = next(tbl)
    if key == nil then return end

    return value, akyrs_unpack_unordered_recursive(tbl, key)
end
"""
overwrite = true
match_indent = true


# vanilla
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = """                        if G.GAME.round_resets.blind == G.P_BLINDS.bl_small then
                            G.GAME.round_resets.blind_states.Small = 'Defeated'"""
position = "before"
payload = "if G.GAME.akyrs_default_blind_handler or AKYRS.should_use_default_blind_handler() then"
match_indent = true
# cryptid 
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = """                        if G.GAME.blind_on_deck == 'Small' then
                            G.GAME.round_resets.blind_states.Small = 'Defeated'"""
position = "before"
payload = "if G.GAME.akyrs_default_blind_handler or AKYRS.should_use_default_blind_handler()  then"
match_indent = true

[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = '''if G.CONTROLLER.HID.controller and self ~= G.hand then self:unhighlight_all() end'''
position = "at"
payload = '''
if (not G.AKYRS_ACTIVE_SHOP or not AKYRS.ShopPages[G.AKYRS_ACTIVE_SHOP].selectable) then
if G.CONTROLLER.HID.controller and self ~= G.hand then self:unhighlight_all() end
end
'''
match_indent = true


[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''      major = args.cover or args.major or nil,'''
position = "after"
payload = '''instance_type = (args.cover or args.major or {}).akyrs_card_eval_layer,'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''              timer_type = 'TOTAL','''
position = "at"
payload = '''timer_type = (args.cover or args.major or {}).akyrs_timer_type or args.timer_type or 'TOTAL','''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''            args.fade = math.max(0, 1 - 3*(G.TIMERS.TOTAL - args.start_time))'''
position = "at"
payload = '''
if (args.cover or args.major or {}).akyrs_timer_type then
args.fade = math.max(0, 1 - 3*(G.TIMERS[(args.cover or args.major or {}).akyrs_timer_type] - args.start_time))
else
args.fade = math.max(0, 1 - 3*(G.TIMERS.TOTAL - args.start_time))
end
'''
match_indent = true
