"""
overwrite = true
match_indent = true



[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = """    for k, v in ipairs(G.playing_cards) do
        v.ability.forced_selection = nil
    end
    
    table.sort(G.hand.highlighted, function(a,b) return a.T.x < b.T.x end)"""
position = "after"
payload = """
local held_cards = AKYRS.filter_table(G.hand.cards, function (cd)
    return not cd.highlighted
end,true,true)
local selected_cards = AKYRS.filter_table(AKYRS.combine_table(G.hand.cards,G.play.cards), function (cd)
    return cd.highlighted or cd.area == G.play
end,true,true)
SMODS.calculate_context({akyrs_extremely_pre_play = true, akyrs_pre_play_cards = selected_cards, akyrs_pre_play_held = held_cards})
"""
overwrite = true
match_indent = true



