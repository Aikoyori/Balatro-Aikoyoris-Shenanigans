[manifest]
version = "1.2"
dump_lua = true
priority = 100

[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = """  G.PITCH_MOD = (G.PITCH_MOD or 1)*(1 - dt) + dt*((not G.normal_music_speed and G.STATE == G.STATES.GAME_OVER) and 0.5 or 1)"""
position = "before"
payload = '''if AKYRS.custom_music_modulation(dt) then
    G.PITCH_MOD = AKYRS.custom_music_modulation(dt)
else'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = """  G.PITCH_MOD = (G.PITCH_MOD or 1)*(1 - dt) + dt*((not G.normal_music_speed and G.STATE == G.STATES.GAME_OVER) and 0.5 or 1)"""
position = "after"
payload = '''end'''
match_indent = true
